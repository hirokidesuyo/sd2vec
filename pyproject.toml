[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sd2vec"
version = "0.1.0"
description = "Interpretable semantic-differential vectors generated by decision models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
inference = ["torch", "transformers>=5.14", "torchvision", "pillow"]
dev = ["pytest>=8"]

[project.scripts]
sd2vec-neighbors = "sd2vec.cli:main"
sd2vec-web = "webapp:main"

[tool.setuptools]
py-modules = ["webapp"]

[tool.setuptools.packages.find]
include = ["sd2vec*"]
